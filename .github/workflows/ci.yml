name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: windows-2022
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.1
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Check the lock file
        run: uv lock --check

      - name: Tests
        run: uv run pytest -q -p no:faulthandler
