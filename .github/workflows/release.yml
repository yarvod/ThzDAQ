name: Build and release

# Push a tag vX.Y.Z (release.py does it) to publish a Windows x64 build that
# the application finds in Help -> Check for updates. Run it by hand to get
# the build as a workflow artifact only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: windows-2022
    env:
      ASSET: ThzDAQ_Windows_x64_${{ github.ref_name }}.zip
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.1
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Check the version against the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          uv sync --locked
          uv run python -c "import sys; from thzdaq_gui.version import __version__ as v; sys.exit(0 if 'v' + v == '${{ github.ref_name }}' else f'version.py has {v}, tag is ${{ github.ref_name }}')"

      - name: Build
        shell: cmd
        run: build.bat

      - name: Smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if (-not (Test-Path dist\ThzDAQ\updater.exe)) { throw "updater.exe is missing" }
          $p = Start-Process dist\ThzDAQ\ThzDAQ.exe -ArgumentList '--quit-after', '5' -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "ThzDAQ.exe did not quit" }
          if ($p.ExitCode -ne 0) { throw "ThzDAQ.exe exited with $($p.ExitCode)" }

      - name: Archive
        run: Compress-Archive -Path dist\ThzDAQ -DestinationPath $env:ASSET

      - uses: actions/upload-artifact@v7
        with:
          name: ThzDAQ_Windows_x64
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ThzDAQ_Windows_x64

      - uses: softprops/action-gh-release@v3
        with:
          files: ThzDAQ_Windows_x64_${{ github.ref_name }}.zip
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          # release.py --again builds a tag again: the new zip replaces the old one
          overwrite_files: true
