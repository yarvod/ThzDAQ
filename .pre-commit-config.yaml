repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
-   repo: https://github.com/psf/black
    rev: 22.10.0
    hooks:
    -   id: black

-   repo: https://github.com/PyCQA/autoflake
    rev: v2.2.1
    hooks:
    -   id: autoflake
        args: [--remove-all-unused-imports, --ignore-init-module-imports, --in-place]

-   repo: local
    hooks:
    -   id: lint-imports
        name: architecture boundaries (import-linter)
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        types_or: [python, toml]
    -   id: no-duplicates
        name: each concept written once (tests/test_architecture.py)
        entry: uv run pytest -q tests/test_architecture.py
        language: system
        pass_filenames: false
        types: [python]
