[project]
name = "thzdaq-gui"
version = "0.0.6b2"
description = "ThzDAQ window: a client of the bench daemon (PySide6)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yarvod" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy==1.26.4",
    "pyqtgraph==0.13.7",
    "pyside6==6.8.2.1",
    "pyside6-qtads==4.3.1.4",
    "qtawesome>=1.3",
    "requests>=2.31",
    "thzdaq-api==0.0.6b2",
]

[project.urls]
Homepage = "https://github.com/yarvod/ThzDAQ"
Documentation = "https://github.com/yarvod/ThzDAQ/blob/master/docs/daemon.md"
Issues = "https://github.com/yarvod/ThzDAQ/issues"
Releases = "https://github.com/yarvod/ThzDAQ/releases"

[project.scripts]
thzdaq-gui = "thzdaq_gui.app:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[tool.uv.sources]
thzdaq-api = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thzdaq_gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
