[project]
name = "thzdaq-gui"
version = "0.1.0"
description = "ThzDAQ desktop application on top of thzdaq-core"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==1.26.4",
    "pyqtgraph==0.13.7",
    "pyside6==6.8.2.1",
    "requests>=2.31",
    "thzdaq-core",
]

[project.scripts]
thzdaq-gui = "thzdaq_gui.app:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[tool.uv.sources]
thzdaq-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thzdaq_gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
