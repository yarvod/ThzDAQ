[project]
name = "thzdaq-mcp"
version = "0.0.6b4"
description = "ThzDAQ MCP server: the bench's tools for agents (Claude Code, Codex), a client of the daemon"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yarvod" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "mcp>=2.3,<2.4",
    "thzdaq-api==0.0.6b4",
]

# thzdaq mcp: the command line serves it when this package is installed
[project.urls]
Homepage = "https://github.com/yarvod/ThzDAQ"
Documentation = "https://github.com/yarvod/ThzDAQ/blob/master/docs/daemon.md"
Issues = "https://github.com/yarvod/ThzDAQ/issues"
Releases = "https://github.com/yarvod/ThzDAQ/releases"

[project.entry-points."thzdaq.cli"]
mcp = "thzdaq_mcp.server:serve"

[tool.uv.sources]
thzdaq-api = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thzdaq_mcp"]
