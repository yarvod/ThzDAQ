[project]
name = "thzdaq-cli"
version = "0.0.6b3"
description = "ThzDAQ command line: a client of the bench daemon"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yarvod" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "thzdaq-api==0.0.6b3",
]

[project.urls]
Homepage = "https://github.com/yarvod/ThzDAQ"
Documentation = "https://github.com/yarvod/ThzDAQ/blob/master/docs/daemon.md"
Issues = "https://github.com/yarvod/ThzDAQ/issues"
Releases = "https://github.com/yarvod/ThzDAQ/releases"

[project.scripts]
thzdaq = "thzdaq_cli.app:main"

[tool.uv.sources]
thzdaq-api = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thzdaq_cli"]
