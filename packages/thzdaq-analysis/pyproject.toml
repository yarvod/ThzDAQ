[project]
name = "thzdaq-analysis"
version = "0.0.6b4"
description = "ThzDAQ analysis: I-V curves, noise temperature, shot noise, 2SB sideband ratios"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yarvod" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/yarvod/ThzDAQ"
Documentation = "https://github.com/yarvod/ThzDAQ/blob/master/docs/daemon.md"
Issues = "https://github.com/yarvod/ThzDAQ/issues"
Releases = "https://github.com/yarvod/ThzDAQ/releases"

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thzdaq_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
