[project]
name = "thzdaq-analysis"
version = "0.1.0"
description = "ThzDAQ analysis: I-V curves, noise temperature, shot noise, 2SB sideband ratios"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thzdaq_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
