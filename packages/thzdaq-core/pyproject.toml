[project]
name = "thzdaq-core"
version = "0.0.6b3"
description = "ThzDAQ bench model, measurements and data without GUI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yarvod" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    # The daemon is tested with numpy 1.x; thzdaq-analysis alone allows 2 for scripts
    "numpy>=1.26,<2",
    "pyflakes>=3.2",
    "pyyaml>=6.0",
    "thzdaq-analysis==0.0.6b3",
    "thzdaq-api==0.0.6b3",
    "thzdaq-instruments==0.0.6b3",
]

[project.urls]
Homepage = "https://github.com/yarvod/ThzDAQ"
Documentation = "https://github.com/yarvod/ThzDAQ/blob/master/docs/daemon.md"
Issues = "https://github.com/yarvod/ThzDAQ/issues"
Releases = "https://github.com/yarvod/ThzDAQ/releases"

[project.scripts]
thzdaq-station = "thzdaq_core.cli.station:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[tool.uv.sources]
thzdaq-analysis = { workspace = true }
thzdaq-api = { workspace = true }
thzdaq-instruments = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thzdaq_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
