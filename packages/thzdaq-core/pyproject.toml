[project]
name = "thzdaq-core"
version = "0.1.0"
description = "ThzDAQ bench model, measurements and data without GUI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "thzdaq-instruments",
]

[project.scripts]
thzdaq-station = "thzdaq_core.station.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[tool.uv.sources]
thzdaq-instruments = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thzdaq_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
