[project]
name = "thzdaq-daemon"
version = "0.1.0"
description = "ThzDAQ bench daemon: holds the instruments and serves the thzdaq-api contract"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "thzdaq-api",
    "thzdaq-core",
]

[project.scripts]
thzdaq-daemon = "thzdaq_daemon.__main__:main"

[tool.uv.sources]
thzdaq-api = { workspace = true }
thzdaq-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thzdaq_daemon"]
