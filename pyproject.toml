[project]
name = "thzdaq"
version = "0.2.0"
description = "Desktop application for SIS mixer control and measurements"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "thzdaq-gui",
    "thzdaq-core",
    "thzdaq-instruments",
]

[dependency-groups]
dev = [
    "pillow==11.1.0",  # PyInstaller converts the PNG icon with it
    "pyinstaller==6.12.0",
    "pytest>=8.2",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
thzdaq-gui = { workspace = true }
thzdaq-core = { workspace = true }
thzdaq-instruments = { workspace = true }

[tool.pytest.ini_options]
# Each package keeps its own tests; conftest files put helpers on sys.path
testpaths = [
    "packages/thzdaq-instruments/tests",
    "packages/thzdaq-core/tests",
    "packages/thzdaq-gui/tests",
]
addopts = "--import-mode=importlib"
